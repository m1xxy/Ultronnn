<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS | Native AI</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        
        :root { --glass-bg: rgba(30, 30, 35, 0.45); --glass-border: rgba(255, 255, 255, 0.12); }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Inter', sans-serif; overflow: hidden; background-color: #000; color: white; }

        #bg-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('https://files.catbox.moe/l2qj63.jpg'); background-size: cover; background-position: center; z-index: -2; transform: scale(1.05); }
        #bg-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.85) 100%); z-index: -1; }

        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid var(--glass-border); border-radius: 24px; box-shadow: 0 24px 40px -12px rgba(0, 0, 0, 0.5); }
        .glass-input { background: rgba(0, 0, 0, 0.3); border: 1px solid var(--glass-border); color: white; transition: all 0.3s ease; }
        .glass-input:focus { outline: none; border-color: rgba(255, 255, 255, 0.4); background: rgba(0, 0, 0, 0.5); }
        .glass-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid var(--glass-border); cursor: pointer; transition: all 0.3s ease; }
        .glass-btn:hover { background: rgba(255, 255, 255, 0.2); }

        #setup-screen, #main-interface { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #main-interface { display: none; z-index: 10; }
        #setup-screen { z-index: 50; padding: 20px; }

        #orb-container { width: 100%; height: 50vh; display: flex; align-items: center; justify-content: center; }
        #orb-canvas { width: 300px; height: 300px; pointer-events: none; }

        #conversation-panel { width: 90%; max-width: 600px; height: 30vh; margin-bottom: 8vh; display: flex; flex-direction: column; overflow-y: auto; padding: 20px; scrollbar-width: none; mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%); }
        #conversation-panel::-webkit-scrollbar { display: none; }

        .message { margin-bottom: 16px; opacity: 0; transform: translateY(10px); animation: slideUpFade 0.5s ease forwards; }
        .msg-you { color: rgba(255, 255, 255, 0.6); font-size: 0.95rem; }
        .msg-jarvis { color: rgba(255, 255, 255, 1); font-size: 1.15rem; font-weight: 300; margin-top: 4px; }
        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }

        .loader { border: 2px solid rgba(255,255,255,0.1); border-top: 2px solid white; border-radius: 50%; width: 18px; height: 18px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        #status-indicator { position: absolute; top: 40px; font-size: 0.75rem; letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,0.4); font-weight: 500; }
        #notification { position: absolute; top: -80px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 20px; background: rgba(255, 60, 60, 0.8); border: 1px solid rgba(255, 60, 60, 0.4); backdrop-filter: blur(12px); color: white; font-size: 0.9rem; transition: all 0.5s; z-index: 100; text-align: center; }
        #notification.show { top: 40px; }

        @media (max-width: 768px) { #orb-container { height: 45vh; } #orb-canvas { width: 250px; height: 250px; } #conversation-panel { height: 40vh; margin-bottom: 2vh; width: 95%; } .msg-jarvis { font-size: 1.05rem; } }
    </style>
</head>
<body>

    <div id="bg-image"></div>
    <div id="bg-overlay"></div>
    <div id="notification"></div>

    <div id="setup-screen">
        <!-- Setup is now just ONE step -->
        <div id="step-openrouter" class="glass-panel w-full max-w-md p-8 flex flex-col items-center text-center">
            <h1 class="text-3xl font-light tracking-wide mb-2">JARVIS</h1>
            <p class="text-white/50 text-sm mb-8">System Initialization</p>
            <div class="w-full text-left mb-2"><label class="text-xs text-white/60 ml-2 uppercase">OpenRouter API Key</label></div>
            <input type="password" id="or-key" class="glass-input w-full px-4 py-3 rounded-xl mb-6 text-sm" placeholder="sk-or-v1-...">
            <button onclick="testOpenRouter()" class="glass-btn w-full py-3 rounded-xl flex items-center justify-center gap-2">
                <span id="btn-text-or">Initialize System</span><div id="loader-or" class="loader"></div>
            </button>
            <p class="text-[10px] text-white/30 mt-5">Using Native Browser Voice Engine (Free)</p>
        </div>
    </div>

    <div id="main-interface">
        <div id="status-indicator">Idle</div>
        <div id="orb-container"><div id="orb-canvas"></div></div>
        <div id="conversation-panel" class="glass-panel">
            <div class="message"><div class="msg-jarvis text-center text-white/40 text-sm italic mt-4">System online. Waiting for voice...</div></div>
        </div>
    </div>

    <script>
        const config = { openrouter: '' };
        let orbState = 'idle'; 
        let isSpeaking = false;
        
        let conversationHistory = [{ role: "system", content: "You are JARVIS. Keep responses brief. Reply in the same language the user uses (English, Urdu, or Punjabi)." }];
        
        // Ensure system voices are loaded (browsers sometimes load them async)
        let systemVoices = [];
        window.speechSynthesis.onvoiceschanged = () => { systemVoices = window.speechSynthesis.getVoices(); };

        const showNotification = (msg) => {
            const el = document.getElementById('notification');
            el.innerText = msg; el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 4000);
        };

        const setLoading = (step, isLoading) => {
            document.getElementById(`btn-text-${step}`).style.display = isLoading ? 'none' : 'block';
            document.getElementById(`loader-${step}`).style.display = isLoading ? 'block' : 'none';
        };

        const updateStatus = (stateStr) => {
            orbState = stateStr.toLowerCase();
            document.getElementById('status-indicator').innerText = stateStr.toUpperCase();
        };

        const appendMessage = (sender, text) => {
            const panel = document.getElementById('conversation-panel');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            msgDiv.innerHTML = sender === 'You' ? `<div class="msg-you">You: "${text}"</div>` : `<div class="msg-jarvis">JARVIS: "${text}"</div>`;
            panel.appendChild(msgDiv);
            panel.scrollTo({ top: panel.scrollHeight, behavior: 'smooth' });
        };

        async function testOpenRouter() {
            const key = document.getElementById('or-key').value.trim();
            if(!key) return showNotification("Please enter OpenRouter Key");
            setLoading('or', true);
            
            try {
                const referer = window.location.href;
                const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST', headers: { 'Authorization': `Bearer ${key}`, 'HTTP-Referer': referer, 'X-Title': 'JARVIS UI', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: "openai/gpt-4o-mini", messages: [{ role: "user", content: "hi" }], max_tokens: 5 })
                });
                
                if(!res.ok) throw new Error("Invalid OpenRouter Key.");
                config.openrouter = key;
                
                // Directly start system since we don't need ElevenLabs anymore
                startSystem();

            } catch (err) { 
                showNotification("OpenRouter connection failed. Check key."); 
                setLoading('or', false);
            } 
        }

        function startSystem() {
            gsap.to("#setup-screen", { opacity: 0, duration: 1, onComplete: () => {
                document.getElementById('setup-screen').style.display = 'none';
                document.getElementById('main-interface').style.display = 'flex';
                
                initOrb();
                gsap.to("#bg-image", { scale: 1.0, duration: 12, repeat: -1, yoyo: true, ease: "sine.inOut" });
                confetti({ particleCount: 50, spread: 60, origin: { y: 0.8 }, colors: ['#ffffff'] });
                
                // Initialize empty speech synthesis to unlock audio context on mobile
                const unlockAudio = new SpeechSynthesisUtterance('');
                unlockAudio.volume = 0;
                window.speechSynthesis.speak(unlockAudio);

                setTimeout(startListening, 1500);
            }});
        }

        const initOrb = () => {
            const container = document.getElementById('orb-canvas'); const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000); camera.position.z = 4;
            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true }); renderer.setSize(300, 300); container.appendChild(renderer.domElement);
            scene.add(new THREE.AmbientLight(0xffffff, 0.4));
            const dl = new THREE.DirectionalLight(0xffffff, 2); dl.position.set(2, 2, 2); scene.add(dl);
            const bl = new THREE.DirectionalLight(0x88ccff, 3); bl.position.set(-2, -2, -2); scene.add(bl);
            const geometry = new THREE.SphereGeometry(1.2, 64, 64);
            const material = new THREE.MeshPhysicalMaterial({ color: 0x111111, metalness: 0.2, roughness: 0.1, transmission: 0.95, thickness: 0.8, ior: 1.5, emissive: 0x112233, emissiveIntensity: 0.3 });
            const sphere = new THREE.Mesh(geometry, material); scene.add(sphere);
            const posAttr = geometry.attributes.position; const vData = [];
            for (let i = 0; i < posAttr.count; i++) vData.push({ x: posAttr.getX(i), y: posAttr.getY(i), z: posAttr.getZ(i) });
            
            let time = 0;
            
            const animate = () => {
                requestAnimationFrame(animate); time += 0.03;
                let tE = 0x112233, int = 0.3, spd = 1, def = 0.04;
                
                if (orbState === 'listening') { 
                    tE = 0x2266aa; int = 0.9; spd = 2.5; def = 0.08; 
                } else if (orbState === 'thinking') { 
                    tE = 0x6633aa; int = 1.0; spd = 4.0; def = 0.12; 
                } else if (orbState === 'speaking') {
                    tE = 0x3388aa; int = 0.8; 
                    // Simulate audio reactivity using math since we don't have an audio stream for native TTS
                    let simulatedAudioMod = isSpeaking ? (Math.sin(time * 15) * 0.3 + Math.random() * 0.3) : 0;
                    def = 0.08 + (simulatedAudioMod * 0.4); 
                    spd = 2 + (simulatedAudioMod * 2.5); 
                    sphere.scale.setScalar(1 + (simulatedAudioMod * 0.15));
                } else {
                    sphere.scale.setScalar(1);
                }
                
                material.emissive.lerp(new THREE.Color(tE), 0.05); material.emissiveIntensity += (int - material.emissiveIntensity) * 0.1;
                
                for (let i = 0; i < posAttr.count; i++) {
                    const v = vData[i], offset = Math.sin(v.x*3 + time*spd) * Math.cos(v.y*3 + time*spd*0.8) * Math.sin(v.z*3 + time*spd*1.2);
                    const norm = new THREE.Vector3(v.x, v.y, v.z).normalize(), disp = def * offset;
                    posAttr.setXYZ(i, v.x + norm.x*disp, v.y + norm.y*disp, v.z + norm.z*disp);
                }
                geometry.computeVertexNormals(); posAttr.needsUpdate = true;
                sphere.rotation.y += 0.004; sphere.rotation.z += 0.002; renderer.render(scene, camera);
            }; animate();
        };

        function startListening() {
            if (!('webkitSpeechRecognition' in window)) return showNotification("Browser does not support Speech Recognition.");
            const rec = new webkitSpeechRecognition(); rec.continuous = false; rec.interimResults = false; rec.lang = 'en-US';
            rec.onstart = () => updateStatus('Listening');
            rec.onresult = (e) => { const text = e.results[0][0].transcript; appendMessage('You', text); processLogic(text); };
            rec.onerror = (e) => { e.error === 'no-speech' ? setTimeout(startListening, 1000) : (updateStatus('Idle'), showNotification("Mic error: " + e.error)); };
            rec.onend = () => { if(orbState === 'listening') updateStatus('Idle'); };
            try { rec.start(); } catch (e) { }
        }

        async function processLogic(text) {
            updateStatus('Thinking'); conversationHistory.push({ role: "user", content: text });
            try {
                const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST', headers: { 'Authorization': `Bearer ${config.openrouter}`, 'HTTP-Referer': window.location.href, 'X-Title': 'JARVIS UI', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: "openai/gpt-4o-mini", messages: conversationHistory })
                });
                if(!res.ok) throw new Error("Brain API failed");
                const data = await res.json();
                let reply = data.choices[0].message.content.replace(/[*#_]/g, '').trim();
                conversationHistory.push({ role: "assistant", content: reply });
                appendMessage('JARVIS', reply); speakOut(reply);
            } catch (err) { showNotification("AI processing failed."); updateStatus('Idle'); setTimeout(startListening, 2000); }
        }

        function speakOut(text) {
            if (!('speechSynthesis' in window)) {
                showNotification("Your browser does not support text-to-speech.");
                setTimeout(startListening, 2000);
                return;
            }

            // Cancel any ongoing speech
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            
            // Try to find a good English voice (system dependent)
            if (systemVoices.length === 0) systemVoices = window.speechSynthesis.getVoices();
            const preferredVoice = systemVoices.find(v => v.name.includes('Daniel') || v.name.includes('UK English') || v.name.includes('Google US English'));
            if (preferredVoice) utterance.voice = preferredVoice;
            
            utterance.rate = 1.0;
            utterance.pitch = 0.9;

            utterance.onstart = () => {
                isSpeaking = true;
                updateStatus('Speaking');
            };

            utterance.onend = () => {
                isSpeaking = false;
                updateStatus('Idle');
                setTimeout(startListening, 800);
            };

            utterance.onerror = (e) => {
                console.error("Speech Synthesis Error:", e);
                isSpeaking = false;
                updateStatus('Idle');
                setTimeout(startListening, 1000);
            };

            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
